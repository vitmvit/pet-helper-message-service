server:
  port: 8084

chat-scheduler:
  cron-expression: "0 0 2 * * ?"
  period: 10

spring:
  application:
    name: pet-helper-message-service
  redis:
    port: 6379
    host: localhost
    cluster:
      enabled: true
  r2dbc:
    driver-class-name: org.postgresql.Driver
    url: r2dbc:postgresql://localhost:5432/messages?stringtype=unspecified
    username: root
    password: root
  liquibase:
    url: jdbc:postgresql://localhost:5432/messages?stringtype=unspecified
    user: root
    password: root
    enabled: true
    change-log: changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/doc/swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

auth-service:
  value: authService
  url: http://localhost:8082/api/v1/auth
user-service:
  value: userService
  url: http://localhost:8081/api/v1/users